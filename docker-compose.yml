# cp .env.example .env   (once), then:  docker compose up --build  ->  http://localhost:3000
services:
  rslides:
    build: ./repos/rslides
    environment:
      SLIDE_DIR: /slides
      MAX_UPLOAD_BYTES: "2147483648"  # 2 GB per uploaded slide
      SESSION_TTL_HOURS: "24"         # uploads are deleted after this
    volumes:
      - ./slides/public:/slides/public:ro   # public slides: drop .svs files here, everyone sees them
      - uploads:/slides/sessions            # anonymous uploads
    expose: ["8080"]
  fs-slides:                 # uploads (chunked), "Your slides" and viewing of uploaded files; guests and signed-in users
    build: ./repos/fs-slides
    environment:
      SLIDE_DIR: /slides
      THUMBNAIL_DIR: /thumbnails
      APP_PORT: "2500"
      GUEST_TTL_HOURS: "24"      # guest uploads (nobody signed in) are deleted after this
      SLIDES_TOKEN_SECRET: ${SLIDES_TOKEN_SECRET:-local-dev-only-secret-change-me-local-dev-only}   # must equal the api's; local default only
    volumes:
      - fsdata:/slides                       # <email>/ and guests/<session>/ folders
      - ./slides/public:/slides/public:ro
      - fsthumbs:/thumbnails
    expose: ["2500"]
  postgres:                  # LOCAL development database. In production the API uses your hosted Postgres (DATABASE_URL).
    image: postgres:16
    environment:
      POSTGRES_USER: pathy
      POSTGRES_PASSWORD: pathy   # local-only credential; never reachable from outside the compose network
      POSTGRES_DB: pathy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathy -d pathy"]
      interval: 3s
      timeout: 3s
      retries: 20
    expose: ["5432"]
  api:                       # accounts, saved annotations and the AI chat; secrets come from .env
    build: ./server          # the same handler runs as a serverless function on Vercel (../api)
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "8080"
      SLIDES_TOKEN_SECRET: ${SLIDES_TOKEN_SECRET:-local-dev-only-secret-change-me-local-dev-only}
      DATABASE_URL: ${DATABASE_URL:-postgres://pathy:pathy@postgres:5432/pathy}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8080"]
  ollama:                    # local LLM so the AI chat can be tested with no API key (opt-in profile)
    image: ollama/ollama:latest
    profiles: ["llm"]        # docker-compose --profile llm up -d ollama
    volumes:
      - ollama:/root/.ollama # downloaded models live here
    expose: ["11434"]
  studio:
    build: ./studio
    environment:
      PORT: "8080"
      RSLIDES_URL: ${RSLIDES_URL:-http://rslides:8080}   # set in .env to use a remote rslides (e.g. Cloud Run) instead of the local container
      FS_SLIDES_URL: ${FS_SLIDES_URL:-http://fs-slides:2500}   # set in .env to use a remote fs-slides
      API_URL: http://api:8080
    ports: ["3000:8080"]
    depends_on: [rslides, fs-slides, api]
volumes:
  uploads:
  fsdata:
  fsthumbs:
  pgdata:
  ollama:
